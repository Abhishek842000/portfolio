<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420">
  <rect width="960" height="420" fill="#fffcf7"/>
  <text x="40" y="42" font-family="Georgia, serif" font-size="20" fill="#1c1916">Waypoint flow</text>
  <rect x="40" y="72" width="180" height="56" rx="12" fill="#e4eef6" stroke="#184e77"/>
  <text x="130" y="105" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#1c1916">Next.js dashboard</text>
  <rect x="40" y="148" width="180" height="56" rx="12" fill="#e4eef6" stroke="#184e77"/>
  <text x="130" y="173" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#1c1916">Public /status</text>
  <text x="130" y="191" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#1c1916">ISR, no login</text>
  <rect x="40" y="224" width="180" height="56" rx="12" fill="#fffcf7" stroke="#ddd6c8"/>
  <text x="130" y="249" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#1c1916">External monitors</text>
  <text x="130" y="267" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#1c1916">API key</text>
  <rect x="300" y="72" width="210" height="48" rx="12" fill="#fffcf7" stroke="#ddd6c8"/>
  <text x="405" y="101" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#1c1916">Auth: JWT or API key</text>
  <rect x="300" y="136" width="210" height="48" rx="12" fill="#fffcf7" stroke="#ddd6c8"/>
  <text x="405" y="165" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#1c1916">@RequirePermission</text>
  <rect x="300" y="200" width="210" height="48" rx="12" fill="#184e77"/>
  <text x="405" y="229" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#fffcf7">tenantDb() Prisma + ALS</text>
  <rect x="580" y="88" width="190" height="56" rx="12" fill="#fffcf7" stroke="#ddd6c8"/>
  <text x="675" y="121" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#1c1916">Postgres</text>
  <rect x="580" y="168" width="190" height="56" rx="12" fill="#fffcf7" stroke="#ddd6c8"/>
  <text x="675" y="193" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#1c1916">Redis / BullMQ</text>
  <text x="675" y="211" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#1c1916">delayed escalation</text>
  <rect x="800" y="128" width="120" height="72" rx="12" fill="#e4eef6" stroke="#184e77"/>
  <text x="860" y="160" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#1c1916">Worker</text>
  <text x="860" y="178" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#1c1916">survives restart</text>
  <path d="M220 100 H300" stroke="#184e77" stroke-width="1.5"/>
  <path d="M220 176 H300" stroke="#184e77" stroke-width="1.5"/>
  <path d="M220 252 H300" stroke="#184e77" stroke-width="1.5"/>
  <path d="M510 224 H580" stroke="#184e77" stroke-width="1.5"/>
  <path d="M770 196 H800" stroke="#184e77" stroke-width="1.5"/>
  <text x="40" y="320" font-family="system-ui, sans-serif" font-size="13" fill="#5e584e">Cross-tenant reads 404; they do not leak an empty 200. Viewers cannot mutate (403).</text>
  <text x="40" y="342" font-family="system-ui, sans-serif" font-size="13" fill="#5e584e">Escalation is a delayed BullMQ job in Redis, not setTimeout in the API process.</text>
  <text x="40" y="364" font-family="system-ui, sans-serif" font-size="13" fill="#5e584e">Org-scoped SSE updates the timeline live. Public status is a separate unauthenticated route.</text>
  <text x="40" y="386" font-family="system-ui, sans-serif" font-size="13" fill="#5e584e">Playwright e2e covers org to invite to policy to API-key trigger to escalate to ack to resolve.</text>
</svg>
